<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">yuanboot Python 框架架构</title>
<desc id="desc">业务 API、控制器与后台任务运行在 Web、gRPC 或 Console 宿主上，共享配置、依赖注入和生命周期，并使用数据库、缓存、服务发现及任务组件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#68b994"/></marker></defs>
